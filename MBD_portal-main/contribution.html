<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDB — Contributions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-nav">Skip to portal content</a>

    <div class="portal-layout">

      <aside class="sidebar" aria-label="Member navigation">
        <div class="sidebar-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            MDB Member
          </div>
          <nav class="menu" aria-label="Member menu">
            <a href="member-dashboard.html">
              <em class="menu-icon" aria-hidden="true">⊞</em> Dashboard
            </a>
            <a href="kaavu-list.html">
              <em class="menu-icon" aria-hidden="true">⛩</em> Kaavu
            </a>
            <a href="events.html">
              <em class="menu-icon" aria-hidden="true">◷</em> Events
            </a>
            <a class="active" href="contribution.html" aria-current="page">
              <em class="menu-icon" aria-hidden="true">◎</em> Contributions
            </a>
            <a href="profile.html">
              <em class="menu-icon" aria-hidden="true">◉</em> My Profile
            </a>
          </nav>
        </div>
        <div class="sidebar-logout">
          <a href="index.html">
            <em class="menu-icon" aria-hidden="true">↩</em> Logout
          </a>
        </div>
      </aside>

      <main id="main-content" class="portal-content">
        <div class="portal-main">

          <section class="portal-top">
            <div>
              <h3>Kaavu Contributions</h3>
              <p>View your past contributions and submit a new one.</p>
            </div>
          </section>

          <!-- History -->
          <section class="card" aria-labelledby="history-heading">
            <h3 id="history-heading">Contribution History</h3>
            <div class="table-responsive">
              <table class="table" role="table" aria-label="Contribution history">
                <thead>
                  <tr>
                    <th scope="col">Date</th>
                    <th scope="col">Kaavu</th>
                    <th scope="col">Description</th>
                    <th scope="col">Amount</th>
                    <th scope="col">Reference ID</th>
                    <th scope="col">Status</th>
                    <th scope="col">Receipt</th>
                  </tr>
                </thead>
                <tbody id="contribution-history-body"></tbody>
              </table>
            </div>
          </section>

          <!-- Add contribution -->
          <section class="section card" aria-labelledby="add-contribution-heading">
            <h3 id="add-contribution-heading">Add New Contribution</h3>
            <form id="contribution-form" novalidate>
              <div class="form-grid">
                <div class="form-group">
                  <label for="contribution-amount">Amount (INR) <span aria-hidden="true" style="color:var(--danger);">*</span></label>
                  <input
                    id="contribution-amount"
                    class="input"
                    type="number"
                    min="1"
                    placeholder="Enter amount in rupees"
                    required
                  />
                </div>
                <div class="form-group">
                  <label for="contribution-kaavu">Kaavu <span aria-hidden="true" style="color:var(--danger);">*</span></label>
                  <select id="contribution-kaavu" class="select" required>
                    <option value="">Choose kaavu</option>
                    <option>Muchilottu Kavu - Taliparamba</option>
                    <option>Muchilottu Kavu - Payyanur</option>
                    <option>Muchilottu Kavu - Azhikode</option>
                    <option>Muchilottu Kavu - Pappinisseri</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label for="contribution-description">Description <span aria-hidden="true" style="color:var(--danger);">*</span></label>
                <textarea
                  id="contribution-description"
                  class="textarea"
                  placeholder="Enter the purpose or details of this contribution"
                  required
                ></textarea>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Proceed to Payment →</button>
              </div>
              <div id="contribution-error" class="alert-box" role="alert" aria-live="polite"></div>
            </form>
          </section>

        </div>
      </main>
    </div>

    <script src="demo-flow.js"></script>
  </body>
</html>
