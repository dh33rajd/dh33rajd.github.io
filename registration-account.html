<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDB — Create Account</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>

    <header class="public-header">
      <div class="wrap">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          MDB Registration
        </div>
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="login.html" class="btn btn-ghost btn-sm">Login</a>
        </nav>
        <details class="mobile-nav-wrap">
          <summary class="nav-toggle" aria-label="Toggle navigation menu">
            <span></span><span></span><span></span>
          </summary>
          <nav class="nav-mobile">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
          </nav>
        </details>
      </div>
    </header>

    <main id="main-content" class="public-main">

      <!-- Step progress bar -->
      <div class="step-bar" role="list" aria-label="Registration steps">
        <div class="step-item active" role="listitem" aria-current="step">
          <div class="step-num">1</div>
          <span class="step-label">Account Setup</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step-item" role="listitem">
          <div class="step-num">2</div>
          <span class="step-label">Contact Details</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step-item" role="listitem">
          <div class="step-num">3</div>
          <span class="step-label">Membership Plan</span>
        </div>
        <div class="step-connector" aria-hidden="true"></div>
        <div class="step-item" role="listitem">
          <div class="step-num">4</div>
          <span class="step-label">Payment</span>
        </div>
      </div>

      <section class="section card">
        <h1>Create Your Account</h1>
        <p style="margin:0;">Enter your name, email address, and a secure password to get started.</p>
      </section>

      <section class="section card" aria-labelledby="account-form-heading">
        <h3 id="account-form-heading">Account Information</h3>
        <form id="registration-account-form" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="fullName">Full Name <span aria-hidden="true" style="color:var(--danger);">*</span></label>
              <input class="input" id="fullName" type="text" placeholder="Enter your full name" autocomplete="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address <span aria-hidden="true" style="color:var(--danger);">*</span></label>
              <input class="input" id="email" type="email" placeholder="Enter email address" autocomplete="email" required />
            </div>
            <div class="form-group">
              <label for="password">Password <span aria-hidden="true" style="color:var(--danger);">*</span></label>
              <input class="input" id="password" type="password" placeholder="Create a strong password" autocomplete="new-password" required />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password <span aria-hidden="true" style="color:var(--danger);">*</span></label>
              <input class="input" id="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" required />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Continue to Contact Details →</button>
            <a class="btn btn-ghost" href="index.html">Back to Home</a>
          </div>
          <div id="account-error" class="alert-box" role="alert" aria-live="polite"></div>
        </form>
      </section>

    </main>
    <script src="demo-flow.js"></script>
  </body>
</html>
